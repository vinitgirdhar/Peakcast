# Litestream streams the hosted SQLite database to Cloudflare R2 so accounts and
# trades survive Render's ephemeral disk. Only scripts/start-hosted.sh uses it;
# the desktop app and local runs never start Litestream.
#
# Values come from the environment (Litestream expands ${VAR}):
#   DATABASE_PATH                 set by scripts/start-hosted.sh
#   LITESTREAM_REPLICA_URL        s3://<bucket>/wildcatter?endpoint=https://<account-id>.r2.cloudflarestorage.com&region=auto
#   LITESTREAM_ACCESS_KEY_ID      R2 API token access key (read automatically)
#   LITESTREAM_SECRET_ACCESS_KEY  R2 API token secret (read automatically)

# Full copy every hour keeps boot-time restores short.
snapshot:
  interval: 1h
  retention: 72h

dbs:
  - path: ${DATABASE_PATH}
    replica:
      url: ${LITESTREAM_REPLICA_URL}
      # Bounds R2 writes (Class A operations) under continuous trading.
      sync-interval: 10s
      # ponytail: on Render's free plan a deploy briefly runs the old and new
      # instance together, both replicating to this path. Auto-recover resets
      # local state and takes a fresh snapshot instead of stopping replication.
      # Ceiling: writes to the old instance during that overlap are lost, and
      # point-in-time history before the reset goes with them. A paid instance
      # with a persistent disk removes the overlap.
      auto-recover: true
