# Render blueprint for the public Wildcatter live demo.
# Free plan: the SQLite file lives on an ephemeral disk. With the three
# LITESTREAM_* values set, scripts/start-hosted.sh restores it from Cloudflare R2
# at boot and streams every change back; without them it resets on every deploy,
# restart or idle spin-down, and the seeded markets are recreated at boot.
services:
  - type: web
    name: wildcatter-welcome
    runtime: static
    buildCommand: node --check public/wake/wake.js
    staticPublishPath: public/wake
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_INSTALL_DEPS
        value: "true"
  - type: web
    name: wildcatter
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && sh scripts/fetch-litestream.sh
    startCommand: sh scripts/start-hosted.sh
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # The server only answers on its own public origin. Render provides
      # RENDER_EXTERNAL_URL, which server/index.ts uses when PUBLIC_ORIGIN is unset.
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: DISPUTE_WINDOW_SECONDS
        value: "120"
      # Secret for operator rulings; generated by Render, never committed.
      - key: OPERATOR_TOKEN
        generateValue: true
      # Cloudflare R2 replica for the database (see litestream.yml). Entered in
      # the Render dashboard, never committed.
      - key: LITESTREAM_REPLICA_URL
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      # Download buttons redirect to the release assets; the builds are not in the repo.
      - key: WINDOWS_DOWNLOAD_URL
        value: https://github.com/vinitgirdhar/wildcatter/releases/latest/download/Wildcatter-Windows.zip
      - key: ANDROID_DOWNLOAD_URL
        value: https://github.com/vinitgirdhar/wildcatter/releases/latest/download/Wildcatter-Android.apk
