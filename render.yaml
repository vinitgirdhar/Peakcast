# Render blueprint for the public Peakcast web app.
# Peakcast runs entirely in the browser (src/local): there is no server and no
# database to host, so this is a free static site that never sleeps. Each
# visitor's data stays in their own browser.
services:
  - type: web
    # Kept from the old warm-up page so the existing site and URL are reused.
    name: wildcatter-welcome
    runtime: static
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # App downloads are GitHub release assets; the builds are not in the repo.
      - type: redirect
        source: /downloads/Peakcast-Windows.zip
        destination: https://github.com/vinitgirdhar/wildcatter/releases/latest/download/Peakcast-Windows.zip
      - type: redirect
        source: /downloads/Peakcast-Android.apk
        destination: https://github.com/vinitgirdhar/wildcatter/releases/latest/download/Peakcast-Android.apk
      # Client-side routes such as /markets/fed-rate load the app shell.
      - type: rewrite
        source: /*
        destination: /index.html
